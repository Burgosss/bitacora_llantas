name: bitacora-llantas
services:
  mongo:
    image: mongo:8.0.17
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./api
    environment:
      MONGODB_URI: mongodb://mongo:27017/bitacora_llantas
      PORT: 3000
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/vehiculos').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  mongo-data:
